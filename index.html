<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomir</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="tarjeta">
    <article class="articulo-zapatillas">
        <header class="cabecera">
            <h1 class="titulo-cabecera"><span class="icono-comprar">🛍️</span>Tienda online</h1>
        </header>
        <div>
            <img class="imagen" src="Tomir 2.0.png" alt="Zapatillas NNormal Tomir 2.0">
        </div>
        <section class="titulo-producto">
            <h2 class="nombre-producto">NNormal Tomir 2.0</h2>
            <p class="discrepcion-producto">Diseñada para largas distancias en terrenos técnicos, la Tomir 02 ofrece agarre y protección en condiciones impredecibles</p>
        </section>
        <div class="precio">
            <p>122€</p>
        </div>
        <section class="seccion-color">
        <h2 class="titulo-color">Color</h2>
        <ul class="lista-colores">
            <li class="opcion-colores">rosa</li>
            <li class="opcion-colores">blanco</li>
            <li class="opcion-colores">verde</li>
        </ul>
        </section>
        <section class="seccion-talla">
        <h2 class="titulo-talla">Talla</h2>
        <ul class="lista-tallas">
            <li class="opcion-tallas">38</li>
            <li class="opcion-tallas">39</li>
            <li class="opcion-tallas">40</li>
            <li class="opcion-tallas">41</li>
            <li class="opcion-tallas">42</li>
        </ul>
        </section>
        <footer>
            <button class="boton-compra">🛒Comprar</button>
        </footer>
    </article>
    </main>
</body>
</html>
